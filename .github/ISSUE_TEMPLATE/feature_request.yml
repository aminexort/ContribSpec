name: Feature request
description: Propose an improvement or new capability
title: '[feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Changes to the **policy schema, report contract, or rule catalog** need
        an [RFC](../blob/main/docs/RFC.md) — you can still start here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need is unmet? Who hits it (maintainers, contributors, tooling)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Concrete shape if you have one (policy snippet, CLI UX, output format).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not involve AI-content detection or authorship inference (project non-goal)
          required: true
        - label: I am willing to help implement or test this
          required: false
