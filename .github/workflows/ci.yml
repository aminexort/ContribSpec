# CI: build, lint, typecheck, tests (Node 20/22 × 3 OSes), dependency audit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4 # TODO(release): pin to commit SHA (scripts/pin-actions.mjs)
      - uses: actions/setup-node@v4 # TODO(release): pin to commit SHA
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  schema-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # TODO(release): pin to commit SHA
      - uses: actions/setup-node@v4 # TODO(release): pin to commit SHA
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run codegen
      - name: Fail if the generated schema module has drift
        run: git diff --exit-code packages/schema/src/generated-schema.ts

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # TODO(release): pin to commit SHA
      - uses: actions/setup-node@v4 # TODO(release): pin to commit SHA
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  action-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # TODO(release): pin to commit SHA
      - uses: actions/setup-node@v4 # TODO(release): pin to commit SHA
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Ensure the action bundle is committed and self-contained
        run: |
          git diff --exit-code packages/github-action/dist/index.mjs
          ! grep -q "node_modules" packages/github-action/dist/index.mjs
