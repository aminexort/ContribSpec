# Static analysis for TypeScript/JavaScript.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4 # TODO(release): pin to commit SHA (scripts/pin-actions.mjs)
      - uses: github/codeql-action/init@v3 # TODO(release): pin to commit SHA
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3 # TODO(release): pin to commit SHA
