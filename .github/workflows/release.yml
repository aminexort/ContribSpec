# Release packaging on tag push. Publishing to npm requires an explicit
# workflow_dispatch with publish=yes AND the repository owner's authorization
# (docs/RELEASING.md). Nothing is ever published implicitly.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (requires owner authorization)'
        type: choice
        options: ['no', 'yes']
        default: 'no'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # TODO(release): pin to commit SHA (scripts/pin-actions.mjs)
      - uses: actions/setup-node@v4 # TODO(release): pin to commit SHA
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4 # TODO(release): pin to commit SHA
        with:
          name: packages
          path: |
            packages/*/dist
            packages/schema/schema
            packages/github-action/dist

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # TODO(release): pin to commit SHA
      - uses: softprops/action-gh-release@v2 # TODO(release): pin to commit SHA
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md

  publish-npm:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'yes'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4 # TODO(release): pin to commit SHA
      - uses: actions/setup-node@v4 # TODO(release): pin to commit SHA
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
